name: DemoForReviewdogs

on:
  - pull_request
jobs:
  demo-job:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
            python-version: '3.10'
      - name: install SQLFluff
        run: 'pip install sqlfluff'
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      - name: format
        run: |
          set +Eeuo pipefail
          lint_results="sqlfluff-lint.json"
          for file in 'sqls/*.sql' 
          do
            sqlfluff lint $file --dialect snowflake --format json | tee "$lint_results"
            lint_results_rdjson="sqlfluff-lint.rdjson"
            cat <"$lint_results" | jq -r -f "./to-rdjson.jq" | tee >"$lint_results_rdjson"
            cat <"$lint_results_rdjson" |
              reviewdog -f=rdjson \
                -name="sqlfluff-lint" \
                -reporter=github-pr-review \
                -filter-mode=nofilter \
                -fail-on-error=true \
                -level=warning
          done
