name: DemoForReviewdogs

on:
  - pull_request
env:
  REVIEWDOG_GITHUB_API_TOKEN: "${{ secrets.REVIEWDOG_GITHUB_API_TOKEN }}"
jobs:
  demo-job:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
            python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install sqlfluff
          pip install sqlfluff==3.0.4
      # Step1: Install reviewdog
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      # Step2: Lint
      - name: lint with SQLFluff
        run: |
          for sql_file in `find sqls/ -name '*.sql'`
          do
            echo "sql_file=$sql_file"
            sqlfluff lint $sql_file --dialect snowflake --format json | jq -f .github/template.jq | reviewdog -f=rdjson -reporter=github-pr-review
          done
