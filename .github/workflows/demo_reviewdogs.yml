name: DemoForReviewdogs

on:
  - pull_request
jobs:
  demo-job:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
            python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install pylint
          pylint --generate-rcfile > ~/.pylintrc
          pip install sqlfluff
      # reviewdog
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      # For pylint
      - name: Lint with pylint
        run: |
          pylint --rcfile=~/.pylintrc *.py | reviewdog -efm="%f:%l:%c: %m" -reporter=github-pr-review
        env:
          REVIEWDOG_GITHUB_API_TOKEN: "${{ secrets.REVIEWDOG_GITHUB_API_TOKEN }}"
      # 
      - name: format
        run: |
          for file in 'sqls/*.sql' 
          do
            sqlfluff lint $file --dialect snowflake --format json
            # sqlfluff lint $file --dialect snowflake --format json |  | reviewdog -efm="%f:%l:%c: %m" -reporter=github-pr-review
          done
