name: ValidateYaml

on:
  push:
    paths:
      # YAML ファイル (.yaml or .yml) をプッシュするたびに実行
      - '**.yaml'
      - '**.yml'
jobs:
  validate-yaml:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: Validate YAML file
        uses: karancode/yamllint-github-action@v2.1.1
        with:
          yamllint_file_or_dir: .
          yamllint_config_filepath: .yamllint
