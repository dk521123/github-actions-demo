name: ValidateJson

on:
  push:
    paths:
      # JSON ファイル (.json) をプッシュするたびに実行
      - '**.json'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Validate JSON file
        run: |
          for file in '**.json'
          do
            echo "- target_file: ${file}"
            jq . $file
          done
