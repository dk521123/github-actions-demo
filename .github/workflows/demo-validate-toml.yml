name: ValidateToml

on:
  push:
    paths:
      # TOML ファイル (.toml) をプッシュするたびに実行
      - '**.toml'
jobs:
  validate-toml:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: Validate TOML file
        uses: yisonPylkita/gh-action-toml-linter@0.1.9
        with:
          # Execute lint check on a specific file or folder.
          file: ../../
